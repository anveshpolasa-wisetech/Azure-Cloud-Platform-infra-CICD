trigger:
  - main
  - develop

pr:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'azureContainerRegistry'
  imageRepository: 'brandnewday-api'
  containerRegistry: 'brandnewday.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  DOCKER_BUILDKIT: 1

stages:
  - stage: CodeQuality
    displayName: Code Quality & Security Scanning
    jobs:
      - job: SonarQube
        displayName: SonarQube Analysis
        steps:
          - task: SonarQubePrepare@5
            inputs:
              SonarCloud: 'SonarCloud'
              organization: 'brandnewday'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'brandnewday_api'
              cliProjectName: 'BND API Service'

      - job: ContainerScan
        displayName: Container Security Scan
        steps:
          - script: |
              echo "Running Trivy vulnerability scan..."
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image --severity HIGH,CRITICAL \
                --exit-code 1 $(containerRegistry)/$(imageRepository):$(tag)

  - stage: Build
    displayName: Build and Push Image
    dependsOn: CodeQuality
    condition: succeeded()
    jobs:
      - job: BuildImage
        displayName: Build Docker Image
        steps:
          - task: Docker@2
            displayName: Build and push image to container registry
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest
              arguments: |
                --build-arg BUILDKIT_INLINE_CACHE=1
                --cache-from type=registry,ref=$(containerRegistry)/$(imageRepository):latest

          - task: PublishBuildArtifacts@1
            displayName: Publish manifests
            inputs:
              pathToPublish: $(Build.SourcesDirectory)/kubernetes
              artifactName: manifests

  - stage: DeployToStaging
    displayName: Deploy to Staging
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        displayName: Deploy to Staging AKS
        environment:
          name: 'staging'
          resourceType: 'Kubernetes'
          resourceName: 'brandnewday-staging-aks'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    artifactName: manifests
                    downloadPath: $(System.ArtifactsDirectory)

                - task: KubernetesManifest@0
                  displayName: Create image pull secret
                  inputs:
                    action: 'createSecret'
                    kubernetesServiceConnection: 'staging-aks'
                    namespace: 'staging'
                    secretType: 'docker-registry'
                    secretName: 'acr-secret'
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

                - task: KubernetesManifest@0
                  displayName: Deploy to Staging
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'staging-aks'
                    namespace: 'staging'
                    manifests: |
                      $(System.ArtifactsDirectory)/manifests/api-deployment.yaml
                      $(System.ArtifactsDirectory)/manifests/api-service.yaml

                - task: KubernetesManifest@0
                  displayName: Bake manifests
                  inputs:
                    action: 'bake'
                    renderingEngine: 'helm'
                    helmChart: '$(System.ArtifactsDirectory)/manifests/helm-chart'
                    helmVersion: 'latest'
                    releaseName: 'brandnewday-api'

  - stage: SmokeTests
    displayName: Smoke Tests
    dependsOn: DeployToStaging
    condition: succeeded()
    jobs:
      - job: RunTests
        displayName: Run API Smoke Tests
        steps:
          - script: |
              echo "Running smoke tests against staging environment..."
              curl -f https://staging-api.brandnewday.com/health || exit 1
              curl -f https://staging-api.brandnewday.com/ready || exit 1

  - stage: ApprovalGate
    displayName: Production Approval
    dependsOn: SmokeTests
    condition: succeeded()
    jobs:
      - job: waitForValidation
        displayName: Wait for manual approval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: 'platform-team@brandnewday.com'
              instructions: 'Please review staging deployment and approve for production'

  - stage: DeployToProduction
    displayName: Deploy to Production
    dependsOn: ApprovalGate
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: Deploy to Production AKS
        environment:
          name: 'production'
          resourceType: 'Kubernetes'
          resourceName: 'brandnewday-production-aks'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    artifactName: manifests
                    downloadPath: $(System.ArtifactsDirectory)

                - task: KubernetesManifest@0
                  displayName: Create image pull secret
                  inputs:
                    action: 'createSecret'
                    kubernetesServiceConnection: 'production-aks'
                    namespace: 'production'
                    secretType: 'docker-registry'
                    secretName: 'acr-secret'
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

                - task: KubernetesManifest@0
                  displayName: Deploy to Production
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'production-aks'
                    namespace: 'production'
                    manifests: |
                      $(System.ArtifactsDirectory)/manifests/api-deployment.yaml
                      $(System.ArtifactsDirectory)/manifests/api-service.yaml

                - script: |
                    echo "Deployment completed. Rolling out new version..."
                    kubectl -n production rollout status deployment/api-service --timeout=5m

  - stage: PostDeployment
    displayName: Post-Deployment Verification
    dependsOn: DeployToProduction
    condition: succeeded()
    jobs:
      - job: HealthCheck
        displayName: Health Checks
        steps:
          - script: |
              echo "Running post-deployment health checks..."
              curl -f https://api.brandnewday.com/health || exit 1
              echo "Production deployment verified successfully"

          - task: PublishPipelineMetadata@0
            inputs:
              artifactName: 'DeploymentSummary'
              jobName: 'HealthCheck'