apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 45
  selector:
    matchLabels:
      app: release-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: release-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: release-demo:lab
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LAB_READY
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: release-demo
spec:
  selector:
    app: release-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
